[workspace]
resolver = "2"
members = [
  "crates/aips-domain",
  "crates/aips-signal-sys",
  "crates/aips-replay",
  "crates/aips-platform",
  "services/aips-core",
  "services/aips-emergency",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.89"

[workspace.dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: audit hashes cover JSON details; floats must parse back bit-exactly or a
# reloaded, untouched chain fails verification.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
neo4rs = "0.8"
rdkafka = { version = "0.37", default-features = false, features = ["cmake-build", "tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
