# AIPS full stack (Phase 0). `docker compose -f deploy/docker-compose.yml up --build`
# Command UI: http://localhost:8090  Keycloak: http://localhost:8081  Temporal UI: http://localhost:8233
# Grafana (profile observability): http://localhost:3000
# All credentials here are LOCAL DEVELOPMENT values. Production secrets come from Vault.
name: aips

x-core-env: &core-env
  AIPS_ENV: development
  AIPS_AUTH_MODE: keycloak
  # Tokens carry the public issuer (browser logins go through localhost:8081); keys are fetched
  # over the compose network.
  AIPS_OIDC_ISSUER: http://localhost:8081/realms/aips
  AIPS_OIDC_JWKS_BASE: http://keycloak:8080/realms/aips
  AIPS_OIDC_AUDIENCE: aips-api
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: aips-dev-root
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: aips
      POSTGRES_PASSWORD: aips-dev
      POSTGRES_DB: aips
    volumes: [pgdata:/var/lib/postgresql/data, ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aips"], interval: 5s, retries: 20 }

  neo4j:
    image: neo4j:5.26-community
    environment: { NEO4J_AUTH: neo4j/aips-dev-graph }
    volumes: [neo4jdata:/data]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"], interval: 10s, retries: 30 }

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, retries: 30 }

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aips
      POSTGRES_PWD: aips-dev
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: aips
    depends_on: { postgres: { condition: service_healthy } }
  temporal-ui:
    image: temporalio/ui:2.31.2
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ["8233:8080"]
    depends_on: [temporal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: aips-dev-admin
      # One issuer for every token, whichever URL the client used (browser or service).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes: [./keycloak/realm-aips.json:/opt/keycloak/data/import/realm-aips.json:ro]
    ports: ["8081:8080"]

  vault:
    image: hashicorp/vault:1.18.3
    cap_add: [IPC_LOCK]
    environment: { VAULT_DEV_ROOT_TOKEN_ID: aips-dev-root, VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200 }
  vault-init:
    image: hashicorp/vault:1.18.3
    environment: { VAULT_ADDR: http://vault:8200, VAULT_TOKEN: aips-dev-root }
    volumes: [./vault/init-dev.sh:/init.sh:ro]
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on: [vault]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./otel/collector.yaml:/etc/otel/config.yaml:ro]

  aips-core:
    build: { context: .., dockerfile: deploy/docker/core.Dockerfile }
    environment:
      <<: *core-env
      AIPS_WORKFLOW_ENGINE: temporal
      AIPS_UI_KEYCLOAK_URL: http://localhost:8081
      AIPS_UI_EMERGENCY_API: http://localhost:8091
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }
    restart: unless-stopped

  aips-emergency:
    build: { context: .., dockerfile: deploy/docker/emergency.Dockerfile }
    environment:
      <<: *core-env
      AIPS_VAULT_PATH: aips/emergency
    volumes: [emergencyjournal:/var/lib/aips/emergency]
    ports: ["8091:8091"]
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "1", memory: 256m } } }
    restart: unless-stopped

  aips-workflow:
    build: { context: .., dockerfile: deploy/docker/workflow.Dockerfile }
    environment:
      AIPS_CORE_URL: http://aips-core:8090
      AIPS_OIDC_ISSUER: http://keycloak:8080/realms/aips
      AIPS_WORKFLOW_CLIENT_ID: aips-workflow
      AIPS_WORKFLOW_CLIENT_SECRET: aips-dev-workflow-secret
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: aips
      KAFKA_BROKERS: kafka:9092
    depends_on: [temporal, kafka, aips-core]
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.0.1
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: aips-dev-grafana }
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]

volumes: { pgdata: {}, neo4jdata: {}, emergencyjournal: {} }
